<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERF - Sistema de Gestão de Tintas</title>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-card">
    <!-- Header de Marca Superior -->
    <header class="brand-header">
        <span>VERF SYSTEM</span>
    </header>

    <div class="card-body">
        <div class="logo-container">
            <img src="img_verf/Logo_Verf.png" alt="VERF - Sistema de Gestão de Tintas" class="logo">
        </div>

        <p class="subtitle">Sistema de Gestão de Tintas</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>
    </div>
</div>

<!-- Script para renderizar os ícones -->
<script>
    lucide.createIcons();
</script>
<script src="app.js"></script>
</body>
</html>
