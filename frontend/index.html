<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERF - Sistema de Gestão de Tintas</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-card">
        <header class="brand-header">
            <span>VERF</span>
        </header>

        <div class="card-body">
            <div class="logo-container">
                <img src="img_verf/Logo_Verf.png" alt="VERF - Sistema de Gestão de Tintas" class="logo">
            </div>

            <p class="subtitle">Sistema de Gestão de Tintas</p>

            <!-- Mantido id="login-form" compatível com o JavaScript -->
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="esqueci-senha.html">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Inicialização dos ícones  e importação dos scripts -->
    <script>
        lucide.createIcons();
    </script>
    <script src="login.js"></script>
</body>
</html>
