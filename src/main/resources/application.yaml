server:
  port: 8090

spring:
  application:
    name: verfS
  datasource:
    url:  jdbc:postgresql://localhost:5432/dbVerf
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
    show-sql: true
